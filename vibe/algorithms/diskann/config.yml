uint8:
  euclidean:
  - base_args: ['@metric']
    constructor: Vamana
    disabled: false
    singularity_image: diskann
    module: vibe.algorithms.diskann
    name: vamana(diskann)
    run_groups:
      diskann-64:
        args:
          graph_degree: [64]
          complexity: [128]
          alpha: [1.2]
        query_args:
          search_complexity: [100, 125, 150, 200, 300, 400, 500, 600, 800, 1000]
      diskann-128:
        args:
          graph_degree: [128]
          complexity: [192]
          alpha: [1.2]
        query_args:
          search_complexity: [100, 125, 150, 200, 300, 400, 500, 600, 800, 1000]
