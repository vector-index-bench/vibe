float:
  cosine:
  - base_args: ['@metric']
    constructor: Scann
    disabled: false
    singularity_image: scann
    module: vibe.algorithms.scann
    name: scann
    run_groups:
      scann-512:
        args:
          n_leaves: [512]
          avq_threshold: [.nan, 0.1, 0.25, 0.4, 0.55]
          dims_per_block: [2, 4]
        query_args:
          leaves_to_search: [2, 4, 8, 16, 32, 64]
          reorder: [100, 200, 300, 400, 600, 800, 1000]
      scann-1024:
        args:
          n_leaves: [1024]
          avq_threshold: [.nan, 0.1, 0.25, 0.4, 0.55]
          dims_per_block: [2, 4]
        query_args:
