uint8:
  euclidean:
  - base_args: ['@metric']
    constructor: SVSVamana
    disabled: false
    singularity_image: svs
    module: vibe.algorithms.svs
    name: vamana(svs)
    run_groups:
      svs-64:
        args:
          graph_max_degree: [64]
          alpha: [1.2]
          window_size: [128]
        query_args:
          search_window_size: [10, 20, 40, 80, 100, 125, 150, 200, 300, 400, 500, 600, 800, 1000]
      svs-128:
        args:
          graph_max_degree: [128]
          alpha: [1.2]
          window_size: [192]
        query_args:
          search_window_size: [10, 20, 40, 80, 100, 125, 150, 200, 300, 400, 500, 600, 800, 1000]
