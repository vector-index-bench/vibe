float:
  any:
  - base_args: ['@metric']
    constructor: GGNN
    disabled: false
    gpu: true
    singularity_image: ggnn
    module: vibe.algorithms.ggnn
    name: ggnn
    run_groups:
      base:
        args:
          k_build: [24, 48, 96]
          tau_build: [0.3, 0.5, 0.7, 0.9]
        query_args:
          tau_query: [0.7, 1.0, 1.3, 1.6, 1.9]
          max_iterations: [200, 400, 800, 1200, 1600, 2000]
