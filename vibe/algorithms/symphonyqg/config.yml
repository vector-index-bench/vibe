    run_groups:
      symphonyqg:
        args:
          degree_bound: [32, 64, 96, 128]
          EF: [400]
          num_iter: [3]
        query_args:
          beam_size: [100, 150, 200, 250, 300, 400, 500, 600, 700, 800, 1000, 1500, 2000]
