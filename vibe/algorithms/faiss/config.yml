binary:
  hamming:
  - base_args: ['@metric']
    constructor: FaissBinaryIVF
    disabled: false
    singularity_image: faiss
    module: vibe.algorithms.faiss
    name: ivf(faiss)
    run_groups:
      base-512:
        args:
          n_list: [512]
        query_args:
          n_probe: [1, 2, 4, 8, 16, 32, 64]
      base-1024:
        args:
          n_list: [1024]
        query_args:
          n_probe: [1, 2, 4, 8, 16, 32, 64, 128]
      base-2048:
        args:
          n_list: [2048]
        query_args:
          n_probe: [1, 2, 4, 8, 16, 32, 64, 128, 256]
      base-4096:
        args:
          n_list: [4096]
        query_args:
          n_probe: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
  - base_args: ['@metric']
    constructor: FaissBinaryHNSW
    disabled: false
    singularity_image: faiss
    module: vibe.algorithms.faiss
    name: hnsw(faiss)
    run_groups:
      base:
        args:
          M: [4, 8, 12, 16, 24, 36, 48, 64, 96]
          efConstruction: [500]
        query_args:
          ef: [10, 20, 30, 40, 50, 60, 80, 100, 150, 200, 300, 400, 500, 600, 800, 1000]
