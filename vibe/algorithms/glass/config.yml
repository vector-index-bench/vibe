float:
  any:
  - base_args: ['@metric']
    constructor: Glass
    disabled: false
    singularity_image: glass
    module: vibe.algorithms.glass
    name: glass
    tags: [graph, quantization]
    run_groups:
      glass:
        args:
          L: [400]
          R: [8, 16, 32, 48, 64]
          quant: [SQ8U]
        query_args:
          search_quant: [SQ4U, SQ8U]
          refine_quant: [FP16, FP32]
          ef: [10, 20, 30, 40, 50, 60, 80, 100, 150, 200, 300, 400, 500, 600, 800, 1000]
