# kci_vec for VIBE (0.2.5): cosine / normalized, euclidean and inner product.
# Builds are single-threaded (module.py THREADS = 1; VIBE also pins the worker to one CPU). k = 100.
# Args are positional in the order written (VIBE expands the dict in key order).
float:
  cosine:
  - base_args: ['@metric']
    constructor: KciVecIvf
    disabled: false
    singularity_image: kci_vec
    module: vibe.algorithms.kci_vec
    name: kci_vec-ivf
    tags: [clustering, quantization]
    run_groups:
      # nlist x soar (0 / 1.5) x cdiv (codes over all dims / over the top dim/2, dim/4 principal directions),
      # default centroid training. i8: float / int8 re-rank, chosen per query
      ivf:
        args:
          nlist: [2048, 4096]
          soar: [0, 1.5]
          cdiv: [1, 2, 4]
          train_sample: [0]
        query_args:
          nprobe: [8, 16, 32, 64, 128, 256]
          rerank: [100, 200, 400, 800]
          gap: [0.0]
          i8: [0, 1]
  - base_args: ['@metric']
    constructor: KciVecQg
    disabled: false
    singularity_image: kci_vec
    module: vibe.algorithms.kci_vec
    name: kci_vec-qg
    tags: [graph, quantization]
    run_groups:
      # int8 HNSW graph, layer 0 as 4-bit neighbour blocks, exploration radius eps, re-rank of the ef-sized set.
      # efC 200: the build is single-threaded here. M 8 / 12 serve recall 0.90 - 0.95, M 16 / 32 the higher end.
      # dpc: dimensions per 4-bit code (2 = smaller blocks, coarser). r8: exact pass over the set (0), int8 scores only (1),
      # exact pass over the best 2k (2).
      qg:
        args:
          M: [8, 12, 16, 32]
          efConstruction: [200]
          dpc: [1, 2]
        query_args:
          ef: [100, 120, 150, 200, 220, 250, 300, 400]
          eps: [0.0, 0.03, 0.05]
          r8: [0, 1, 2]
  normalized:
  - base_args: ['@metric']
    constructor: KciVecIvf
    disabled: false
    singularity_image: kci_vec
    module: vibe.algorithms.kci_vec
    name: kci_vec-ivf
    tags: [clustering, quantization]
    run_groups:
      # nlist x soar (0 / 1.5) x cdiv (codes over all dims / over the top dim/2, dim/4 principal directions),
      # default centroid training. i8: float / int8 re-rank, chosen per query
      ivf:
        args:
          nlist: [2048, 4096]
          soar: [0, 1.5]
          cdiv: [1, 2, 4]
          train_sample: [0]
        query_args:
          nprobe: [8, 16, 32, 64, 128, 256]
          rerank: [100, 200, 400, 800]
          gap: [0.0]
          i8: [0, 1]
  - base_args: ['@metric']
    constructor: KciVecQg
    disabled: false
    singularity_image: kci_vec
    module: vibe.algorithms.kci_vec
    name: kci_vec-qg
    tags: [graph, quantization]
    run_groups:
      # int8 HNSW graph, layer 0 as 4-bit neighbour blocks, exploration radius eps, re-rank of the ef-sized set.
      # efC 200: the build is single-threaded here. M 8 / 12 serve recall 0.90 - 0.95, M 16 / 32 the higher end.
      # dpc: dimensions per 4-bit code (2 = smaller blocks, coarser). r8: exact pass over the set (0), int8 scores only (1),
      # exact pass over the best 2k (2).
      qg:
        args:
          M: [8, 12, 16, 32]
          efConstruction: [200]
          dpc: [1, 2]
        query_args:
          ef: [100, 120, 150, 200, 220, 250, 300, 400]
          eps: [0.0, 0.03, 0.05]
          r8: [0, 1, 2]
  euclidean:
  - base_args: ['@metric']
    constructor: KciVecIvf
    disabled: false
    singularity_image: kci_vec
    module: vibe.algorithms.kci_vec
    name: kci_vec-ivf
    tags: [clustering, quantization]
    run_groups:
      # nlist x soar (0 / 1.5) x cdiv (codes over all dims / over the top dim/2, dim/4 principal directions),
      # default centroid training. i8: float / int8 re-rank, chosen per query
      ivf:
        args:
          nlist: [2048, 4096]
          soar: [0, 1.5]
          cdiv: [1, 2, 4]
          train_sample: [0]
        query_args:
          nprobe: [8, 16, 32, 64, 128, 256]
          rerank: [100, 200, 400, 800]
          gap: [0.0]
          i8: [0, 1]
  - base_args: ['@metric']
    constructor: KciVecQg
    disabled: false
    singularity_image: kci_vec
    module: vibe.algorithms.kci_vec
    name: kci_vec-qg
    tags: [graph, quantization]
    run_groups:
      # int8 HNSW graph, layer 0 as 4-bit neighbour blocks, exploration radius eps, re-rank of the ef-sized set.
      # efC 200: the build is single-threaded here. M 8 / 12 serve recall 0.90 - 0.95, M 16 / 32 the higher end.
      # dpc: dimensions per 4-bit code (2 = smaller blocks, coarser). r8: exact pass over the set (0), int8 scores only (1),
      # exact pass over the best 2k (2).
      qg:
        args:
          M: [8, 12, 16, 32]
          efConstruction: [200]
          dpc: [1, 2]
        query_args:
          ef: [100, 120, 150, 200, 220, 250, 300, 400]
          eps: [0.0, 0.03, 0.05]
          r8: [0, 1, 2]
  # inner product (kci_vec_new_ip). kci_vec-ql: lists learned from the query sample VIBE gives to fit_ood.
  # ef < 0 = the lists' int8 copies scanned, the -ef best scored exactly (ncl x per decide the recall); ef > 0 = the lists start the graph search.
  ip:
  - base_args: ['@metric']
    constructor: KciVecQl
    disabled: false
    ood: true
    singularity_image: kci_vec
    module: vibe.algorithms.kci_vec
    name: kci_vec-ql
    tags: [clustering, graph, quantization]
    run_groups:
      lists:
        args:
          M: [16]
          efConstruction: [200]
          nclusters: [1024]
          cap: [4000]
        query_args:
          ncl: [1, 2, 4, 8, 10, 12, 16, 24, 32]
          per: [1000, 2000, 4000]
          ef: [-150, -200, -300, -400, -600]
          seeds: [0]
          pages: [0]
      lists2:
        args:
          M: [16]
          efConstruction: [200]
          nclusters: [1024]
          cap: [4000]
        query_args:
          ncl: [1, 2, 4]
          per: [1000, 2000, 4000]
          ef: [-150, -200]
          seeds: [0]
          pages: [2, 3, 4]
      hot:
        args:
          M: [16]
          efConstruction: [200]
          nclusters: [1024]
          cap: [4000]
        query_args:
          ncl: [1, 2, 4]
          per: [2000, 4000]
          ef: [-200, -300, -400, -600]
          seeds: [0]
          pages: [0]
          hot: [4000, 8000, 16000, 24000, 32000, 48000]
      seeded:
        args:
          M: [16]
          efConstruction: [200]
          nclusters: [1024]
          cap: [4000]
        query_args:
          ncl: [2, 4, 8]
          per: [2000, 4000]
          ef: [150, 200, 300, 400, 500, 600, 800]
          seeds: [100, 200]
          pages: [0]
  - base_args: ['@metric']
    constructor: KciVecQg
    disabled: false
    singularity_image: kci_vec
    module: vibe.algorithms.kci_vec
    name: kci_vec-qg
    tags: [graph, quantization]
    run_groups:
      qg:
        args:
          M: [16, 32]
          efConstruction: [200]
          dpc: [1]
        query_args:
          ef: [400, 800, 1600, 3200]
          eps: [0.0, 0.005]
          r8: [0]
  - base_args: ['@metric']
    constructor: KciVecIvf
    disabled: false
    singularity_image: kci_vec
    module: vibe.algorithms.kci_vec
    name: kci_vec-ivf
    tags: [clustering, quantization]
    run_groups:
      # the partitioned index on inner product, for data whose answers are not concentrated
      # nlist x soar (0 / 1.5) x cdiv (codes over all dims / over the top dim/2, dim/4 principal directions),
      # default centroid training. i8: float / int8 re-rank, chosen per query
      ivf:
        args:
          nlist: [2048, 4096]
          soar: [0, 1.5]
          cdiv: [1, 2, 4]
          train_sample: [0]
        query_args:
          nprobe: [8, 16, 32, 64, 128, 256]
          rerank: [100, 200, 400, 800]
          gap: [0.0]
          i8: [0, 1]
  # kci_vec-qv: candidates voted by the nearest sample queries, for data whose answers are not concentrated
  # (cqadupstack-lemur / muvera). voters: sample queries taken; efx: ef of that search = voters * efx; keepx: the short
  # code keeps keepx * rerank of the union (0 = no short code); rerank: scored exactly.
  - base_args: ['@metric']
    constructor: KciVecQv
    disabled: false
    ood: true
    singularity_image: kci_vec
    module: vibe.algorithms.kci_vec
    name: kci_vec-qv
    tags: [graph, quantization]
    run_groups:
      voted:
        args:
          M: [16]
          efConstruction: [200]
          qdim: [256]
          sdim: [512, 1024]
          qproj: [pca]
        query_args:
          voters: [50, 100, 200, 400, 800, 1600, 3200, 6000, 10000]
          efx: [1.3]
          keepx: [3, 6, 12]
          rerank: [200, 500, 1000]
